name: Documentation

on:
  push:
    branches:
      - master
    paths:  # the page shows plots made by the library, so its sources count too
      - 'docs/**'
      - 'src/**'
      - 'include/**'
      - 'python/**'
      - 'templates/**'
      - 'scripts/generateExampleData.C'
      - 'CMakeLists.txt'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    if: github.repository == 'SciRooPlot/SciRooPlot'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Typst
        uses: typst-community/setup-typst@v5

      # the web page renders its plots with SciRooPlot itself: build and install it as in the build workflow
      - name: Cache Linux packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-docs-${{ hashFiles('.github/scripts/install-linux.sh', '.github/workflows/docs.yml') }}
          restore-keys: apt-docs-

      - name: Install Linux dependencies
        run: |
          APT_ARCHIVES=~/apt-archives ./.github/scripts/install-linux.sh
          # for recording the terminal demo of the start page (docs/site/record-demo.sh); DejaVu Sans is also the font of the slides
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="${HOME}/apt-archives" openbox xcompmgr hsetroot xterm xdotool nano imagemagick bc ffmpeg fonts-dejavu-core
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      - name: Install ROOT
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: docs
          create-args: >-
            root_base
            pip
            numpy
            pandas
            pillow
            -c conda-forge
          cache-environment: true

      - name: Build and install SciRooPlot
        shell: bash -el {0}
        run: |
          cmake -S . -B build-srp -G Ninja -DCMAKE_PREFIX_PATH="${CONDA_PREFIX}" -DCMAKE_BUILD_TYPE=Release
          cmake --build build-srp --parallel
          cmake --install build-srp --prefix install

      - name: Build web page
        shell: bash -el {0}
        run: |
          rm -rf build
          source install/share/scirooplot/env.sh
          ./docs/site/build-site.sh build

      - name: Add markdown sources, skill and slides
        run: |
          # the markdown sources next to the web page, for llms.txt and for agents fetching the skill
          cp docs/api-changes.md docs/llms.txt build/
          mkdir -p build/skill/scirooplot/reference
          cp docs/skill/scirooplot/SKILL.md build/skill/scirooplot/
          cp docs/skill/scirooplot/reference/*.md build/skill/scirooplot/reference/
          (cd docs/skill && zip -r ../../build/skill/scirooplot.skill scirooplot)   # a .skill file is a zip of the skill folder
          mkdir -p build/slides
          version=$(sed -n '/^project(/,/)/s/^ *VERSION *\([0-9.]*\)$/\1/p' CMakeLists.txt)
          typst compile docs/slides/slides.typ build/slides/SciRooPlot_UserManual_cpp.pdf --input lang=cpp --input "version=${version}"
          typst compile docs/slides/slides.typ build/slides/SciRooPlot_UserManual_py.pdf --input lang=py --input "version=${version}"

      - name: Check output
        run: |
          find build -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy-pages:
    needs: build-docs
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
