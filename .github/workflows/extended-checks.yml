name: Extended checks

# Slower checks that do not need to run on every push: weekly (skipped if the
# default branch had no new commit in the last week) and on demand.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for new commits
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ -n "$(git log -1 --since='7 days ago' --format=%H)" ]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No new commits in the last week -- skipping."
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi

  sanitizers:
    needs: changes
    if: needs.changes.outputs.run == 'true'

    name: sanitizers

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: ./.github/scripts/install-linux.sh

      - name: Install ROOT
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: build
          create-args: >-
            root_base
            -c conda-forge
          cache-environment: true

      # no -Werror: with sanitizers GCC reports false positives in Boost, pybind11 and libstdc++ headers
      - name: Configure
        shell: bash -el {0}
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="${CONDA_PREFIX}" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"

      - name: Build
        shell: bash -el {0}
        run: |
          cmake --build build --parallel

      - name: Install
        shell: bash -el {0}
        run: |
          cmake --install build --prefix install

      # the sanitizer runtimes are preloaded, since python and the user programs built by the test are not instrumented;
      # ROOT does not free all its memory at exit, so leak detection is off
      - name: Integration test
        shell: bash -el {0}
        env:
          SRP_TEST_INSTALL: ${{ github.workspace }}/install
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libubsan.so)"
          export LD_PRELOAD
          ./.github/scripts/test-example-project.sh

  # all dependencies at the minimum versions required in CMakeLists.txt
  floor:
    needs: changes
    if: needs.changes.outputs.run == 'true'

    name: dependency floor

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read ROOT floor
        id: floor
        run: |
          echo "root=$(sed -n 's/^set(REQUIRED_ROOT_VERSION \(.*\))$/\1/p' CMakeLists.txt)" >> "${GITHUB_OUTPUT}"

      # Python 3.10 is the newest Python supported by the pybind11 floor
      - name: Install ROOT
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: floor
          create-args: >-
            root_base=${{ steps.floor.outputs.root }}
            python=3.10
            -c conda-forge
          cache-environment: true

      - name: Install CMake, pybind11, fmt and Boost
        shell: bash -el {0}
        run: |
          ./.github/scripts/install-floor.sh floor-deps

      # fails if a dependency other than the floor version was picked up
      - name: Configure
        shell: bash -el {0}
        run: |
          set -o pipefail
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="${PWD}/floor-deps;${CONDA_PREFIX}" \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" \
            -DCMAKE_BUILD_TYPE=Release \
            | tee configure.log
          for dependency in ROOT BOOST FMT; do
            required=$(sed -n "s/^set(REQUIRED_${dependency}_VERSION \(.*\))$/\1/p" CMakeLists.txt)
            grep -iE "^-- ${dependency} +version: ${required//./\\.}(\.0)*$" configure.log
          done
          ! grep 'fetching it now' configure.log

      - name: Build
        shell: bash -el {0}
        run: |
          cmake --build build --parallel

      - name: Install
        shell: bash -el {0}
        run: |
          cmake --install build --prefix install

      - name: Integration test
        shell: bash -el {0}
        env:
          SRP_TEST_INSTALL: ${{ github.workspace }}/install
        run: |
          ./.github/scripts/test-example-project.sh
